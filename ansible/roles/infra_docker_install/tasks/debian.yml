# Configure docker pre-requisites on debian based systems
- name: Ensure prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
    state: present
    update_cache: true
  become: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key and save to keyring directory
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Get device architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: infra_docker_install_architecture_result
  changed_when: false

- name: Add Docker Repo to apt source list
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris:
      [
        'https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}',
      ]
    suites: ['{{ ansible_facts["distribution_release"] }}']
    components: [stable]
    architectures: ["{{ infra_docker_install_architecture_result.stdout }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true
