name: Ansible CI
on:
  workflow_dispatch:

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v6
      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: ""
          setup_python: "true"
          python_version: "3.14"
          working_directory: "${{ github.workspace }}/ansible" # Set the working directory to the ansible folder
          requirements_file: "ansible/requirements.yml"


